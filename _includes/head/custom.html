<!-- Language: Spanish for Spanish-language browsers, English otherwise.
     Runs only on a visitor's first page view; a click on ES/EN is remembered. -->
<script>
(function () {
  try {
    var KEY = 'site-lang';
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[data-lang]');
      if (a) localStorage.setItem(KEY, a.getAttribute('data-lang'));
    });
    if (localStorage.getItem(KEY)) return;
    var path = location.pathname;
    if (path !== '/' && path !== '/index.html') return;
    var langs = navigator.languages || [navigator.language || ''];
    if ((langs[0] || '').toLowerCase().indexOf('es') === 0) {
      localStorage.setItem(KEY, 'es');
      location.replace('/es/');
    }
  } catch (err) {}
})();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var secs = [].slice.call(document.querySelectorAll('.page-section'));
    var links = [].slice.call(document.querySelectorAll('#site-nav .visible-links a[href*="#"], #site-nav .hidden-links a[href*="#"]'));
    function update() {
      var cur = null;
      secs.forEach(function (s) { if (s.getBoundingClientRect().top <= 140) cur = s.id; });
      document.querySelectorAll('#site-nav a[href*="#"]').forEach(function (a) { a.classList.toggle('is-active', cur && a.hash === '#' + cur); });
      secs.forEach(function (s) { if (s.getBoundingClientRect().top < window.innerHeight * 0.88) s.classList.add('is-visible'); });
    }
    secs.forEach(function (s) { s.classList.add('reveal'); });
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update(); setTimeout(update, 300);
  });
</script>
